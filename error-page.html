<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oops. We’ve Lost Contact…</title>
    <link href="./error-page-styles.css" rel="stylesheet" />

    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:100,200,300,400,500,600,700,800,900&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="pwb-error-page-wrap">
      <div class="pwb-error-page-relative-container">
        <div class="pwb-error-page-content">
          <h1 class="pwb-error-page-title">Oops! We’ve Lost Contact...</h1>
          <p class="pwb-error-page-description">
            This page seems to have drifted off into the void.
            <br />
            Check your internet connection or give it another go in a bit!
          </p>
          <button
            id="pwb-error-page-refresh-button"
            class="reset-button"
            onclick="window.location.reload()"
          >
            <div class="pwb-error-page-ic-arrow-clockwise"></div>
            <div class="pwb-error-page-refresh-button-text">Refresh</div>
          </button>
        </div>
        <div class="pwb-error-page-gradient-ellipse"></div>
      </div>
    </div>
  </body>
</html>
