    window._pwInitialPath = "/";

    // Rewrite files.peachworlds.com URLs to our local CDN proxy
    function _pwLocalUrl(url) {
      return typeof url === 'string'
        ? url.replace('https://files.peachworlds.com/website/', '/cdn/website/')
        : url;
    }

    // Intercept ALL fetch/XHR — including Three.js GLTFLoader direct fetches —
    // so files.peachworlds.com URLs are rewritten before they ever hit the network.
    (function() {
      var _fetch = window.fetch;
      window.fetch = function(input, init) {
        if (typeof input === 'string') input = _pwLocalUrl(input);
        else if (input && input.url) input = new Request(_pwLocalUrl(input.url), input);
        return _fetch.call(this, input, init);
      };
      var _xhrOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        if (typeof url === 'string') url = _pwLocalUrl(url);
        return _xhrOpen.apply(this, [method, url].concat(Array.prototype.slice.call(arguments, 2)));
      };
    })();

    // Required by the PeachWeb runtime (191.script.js).
    // Must return a blob URL string — the router fetches it and checks the Content-Type header.
    // Also intercepts the scene-state JSON to inject live bait config from localStorage.
    window._pwLoadFileFromCache = async function(url) {
      const localUrl = _pwLocalUrl(url);
      const res = await fetch(localUrl);
      if (!res.ok) throw new Error('Failed to load asset: ' + localUrl);

      const blob = await res.blob();
      return URL.createObjectURL(blob);
    };
    window._pwSetFileCache = function() {};
  </script>

<script>
function initVideoHoverWrapper(wrapper) {
  const video = wrapper.querySelector(".hover-video");
  const poster = wrapper.querySelector(".video-poster");
  if (poster && poster.dataset.src && !poster.src) poster.src = poster.dataset.src;
  const playOnHover = () => {
    if (!video.src) { video.src = video.dataset.src; video.load(); setTimeout(() => video.play().catch(function(){}), 100); }
    else { video.play().catch(function(){}); }
    if (poster) poster.style.opacity = "0";
  };
  const pauseAndReset = () => {
    video.pause(); video.currentTime = 0;
    setTimeout(function() { if (poster) poster.style.opacity = "1"; }, 100);
  };
  if (!wrapper._hoverAttached) {
    wrapper.addEventListener("mouseenter", playOnHover);
    wrapper.addEventListener("mouseleave", pauseAndReset);
    wrapper._hoverAttached = true;
  }
}
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll(".video-hover-wrapper").forEach(initVideoHoverWrapper);
});
</script>

  <label>Y <span id="lbl-y"></span></label>
  <input id="sl-y" type="range" min="-1" max="1" step="0.005" style="width:100%;margin-bottom:10px">
  <div style="border-top:1px solid rgba(255,255,255,0.15);margin:8px 0;padding-top:8px;font-size:11px;opacity:0.5">ROTATION (deg)</div>
  <label>Rot X <span id="lbl-rx"></span></label>
  <input id="sl-rx" type="range" min="-180" max="180" step="1" style="width:100%;margin-bottom:10px">
  <label>Rot Y <span id="lbl-ry"></span></label>
  <input id="sl-ry" type="range" min="-180" max="180" step="1" style="width:100%;margin-bottom:10px">
  <label>Rot Z <span id="lbl-rz"></span></label>
  <input id="sl-rz" type="range" min="-180" max="180" step="1" style="width:100%;margin-bottom:14px">
  <button onclick="applyBait()" style="width:100%;padding:8px;border-radius:8px;border:none;background:#6c3fff;color:#fff;font-weight:700;cursor:pointer;margin-bottom:6px;">Apply & Reload</button>
  <button onclick="copyBait()" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#fff;cursor:pointer;">Copy Values</button>
</div>
<script>
(function() {
  var keys   = ['scale','x','y'];
  var rotKeys = ['rx','ry','rz'];
  var DEG = Math.PI / 180;

  function initSliders(cfg) {
    keys.forEach(function(k) {
      var sl = document.getElementById('sl-' + k);
      sl.value = cfg[k];
      document.getElementById('lbl-' + k).textContent = parseFloat(cfg[k]).toFixed(3);
      sl.addEventListener('input', function() {
        document.getElementById('lbl-' + k).textContent = parseFloat(this.value).toFixed(1);
      });
    });
    // rotation stored as radians, display as degrees
    var rx = cfg.rx !== undefined ? cfg.rx : 80;
    var ry = cfg.ry !== undefined ? cfg.ry : 0;
    var rz = cfg.rz !== undefined ? cfg.rz : 0;
    [['rx',rx],['ry',ry],['rz',rz]].forEach(function(pair) {
      var sl = document.getElementById('sl-' + pair[0]);
      sl.value = pair[1];
      document.getElementById('lbl-' + pair[0]).textContent = pair[1] + '°';
      sl.addEventListener('input', function() {
        document.getElementById('lbl-' + pair[0]).textContent = this.value + '°';
      });
    });
  }

  fetch('/bait-config').then(function(r){ return r.json(); }).then(initSliders);

  window.applyBait = function() {
    var c = {};
    keys.forEach(function(k) { c[k] = parseFloat(document.getElementById('sl-' + k).value); });
    rotKeys.forEach(function(k) { c[k] = parseFloat(document.getElementById('sl-' + k).value); });
    fetch('/apply-bait', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(c)
    }).then(function() { location.reload(); });
  };

  window.copyBait = function() {
    var c = {};
    keys.forEach(function(k) { c[k] = parseFloat(document.getElementById('sl-' + k).value); });
    rotKeys.forEach(function(k) { c[k] = parseFloat(document.getElementById('sl-' + k).value); });
    navigator.clipboard.writeText(JSON.stringify(c, null, 2));
  };

})();
</script>

</body>
</html>
